<app-header></app-header>

<div class="container mt-5">
  <h2 class="text-center mb-4">Reset Your Password</h2>

  <!-- Status -->
  <div *ngIf="message" class="alert alert-info text-center">{{ message }}</div>

  <!-- Step 1: Email -->
  <div *ngIf="step === 1" class="mb-3">
    <label></label>
    <input type="email" class="form-control"
           [(ngModel)]="email" name="email" required
           placeholder="Enter your registered email" />
    <button type="button" class="btn btn-primary w-100 mt-3" (click)="sendOtp()">Send OTP</button>
  </div>

  <!-- Step 2: OTP -->
  <div *ngIf="step === 2" class="mb-3">
    <label>OTP</label>
    <input type="text" class="form-control"
           [(ngModel)]="otp" name="otp" required
           placeholder="Enter OTP" />
    <button type="button" class="btn btn-success w-100 mt-3" (click)="verifyOtp()">Verify OTP</button>
  </div>

  <!-- Step 3: New Password -->
  <div *ngIf="step === 3">
      <!-- New Password -->
      <div class="mb-3 position-relative">
        <label>New Password</label>
        <input [type]="showNewPassword ? 'text' : 'password'" class="form-control"
               [(ngModel)]="newPassword" name="newPassword" required minlength="8"
               placeholder="Enter new password" 
               (ngModelChange)="checkPasswords()"/>
        <span class="toggle-password position-absolute top-50 end-0 translate-middle-y me-3"
              (click)="toggleNewPassword()">👁️</span>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3 position-relative">
        <label>Confirm Password</label>
        <input [type]="showConfirmPassword ? 'text' : 'password'" class="form-control"
               [(ngModel)]="confirmPassword" name="confirmPassword" required minlength="8"
               placeholder="Re-enter new password" 
               (ngModelChange)="checkPasswords()"/>
        <span class="toggle-password position-absolute top-50 end-0 translate-middle-y me-3"
              (click)="toggleConfirmPassword()">👁️</span>
      </div>

       <div *ngIf="passwordMatch" class="text-success mt-2">
        Passwords match
       </div>
       <div *ngIf="!passwordMatch && confirmPassword" class="text-danger mt-2">
        Passwords do not match
       </div>

      <button type="button" class="btn btn-warning w-100 mt-3" 
      [disabled]="!passwordMatch"
      (click)="resetPassword()">Reset Password</button>
    </div>
    </div>

<app-footer></app-footer>
