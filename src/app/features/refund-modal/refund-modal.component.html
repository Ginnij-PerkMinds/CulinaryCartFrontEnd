<div class="modal fade" id="refundModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content rounded-3 shadow-lg">
      <div class="modal-header bg-blood-orange text-white">
        <h5 class="modal-title">Claim Refund</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <!-- Step 1: Show eligible orders -->
        <!-- <h6>Select an order to claim refund</h6> -->
        <table class="table table-sm">
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Date & Time</th>
              <th>Amount</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let order of eligibleOrders">
              <td>#{{ order.orderId }}</td>
              <td>{{ order.orderDate | date:'dd/MM/yyyy, h:mm a' }}</td>
              <td>{{ order.finalAmount | currency:'INR' }}</td>
              <td>
                <button class="btn btn-info btn-sm" (click)="viewOrderDetails(order)">
                  View Details
                </button>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- Step 2: Show item selection and refund form once order is chosen -->
        <div *ngIf="selectedOrder">
          <hr />
          <h6>Order #{{ selectedOrder.orderId }} Items</h6>
         
          <!-- Master checkbox for All Items -->
          <div class="form-check">
            <input type="checkbox" class="form-check-input"
            id="selectAll"
            [(ngModel)]="selectAllChecked"
            (change)="toggleAllItems()">
            <label class="form-check-label" for="selectAll">All Items</label>
           </div>

          <!-- Individual item checkboxes -->
           <div class="row">
          <div class = "col-6 mb-2" *ngFor="let item of selectedOrder.orderItems; let i = index">
          <div class="form-check">
             <input type="checkbox" class="form-check-input"
             id="item{{i}}"
             [(ngModel)]="item.checked"
             (change)="toggleSingleItem()">
             <label class="form-check-label" for="item{{i}}">
             {{ item.foodItemName }} 
             </label>
          </div>
           </div>
       <div class="mt-3">
         <p><strong>Refund Total:</strong> {{ selectedItemsTotal | currency:'INR' }}</p>
       </div>

          <!-- Remarks -->
          <label class="form-label mt-3">Remarks:</label>
          <textarea class="form-control" [(ngModel)]="userRemarks" placeholder="Reason for refund"></textarea>

          <!-- Proof upload -->
          <label class="form-label mt-3">Proof Image:</label>
          <input type="file" class="form-control" (change)="onFileSelected($event)" />
        </div>
      </div>

      <div class="modal-footer" *ngIf="selectedOrder">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-warning" (click)="submitRefund()">Submit Claim</button>
      </div>
    </div>
  </div>
</div>
