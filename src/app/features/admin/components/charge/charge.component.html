<div class="dashboard-inner-card shadow-sm border-0 bg-soft-peach p-4 rounded-4">
  <!-- Header -->
  <div class="d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-3 mb-4">
    <div>
      <h3 class="charge-catalogue-title m-0"> Manage Charges</h3>
      <p class="text-muted small m-0">Manage charge types, values, and active status</p>
    </div>
    <button class="btn btn-blood-orange" data-bs-toggle="modal" data-bs-target="#chargeModal" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i> Add Charge
    </button>
  </div>

  <!-- Charges Table -->
  <div class="table-responsive border rounded-3 overflow-hidden">
    <table class="table table-hover align-middle custom-premium-table m-0">
      <thead>
        <tr>
          <th class="ps-4">ID</th>
          <th>Charge Type</th>
          <th>Value</th>
          <th>Active</th>
          <th class="text-center pe-4">Workspace Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let charge of charges" class="table-row-item animate fadeIn">
          <td class="fw-bold text-secondary ps-4">#{{ charge.chargeId }}</td>
          <td><strong>{{ charge.chargeType }}</strong></td>
          <td>{{ charge.value }}</td>
          <td>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox"
                     [(ngModel)]="charge.isActive"
                     (change)="toggleActive(charge)">
            </div>
          </td>
          <td>
            <div class="d-flex justify-content-center gap-2 pe-4">
              <button class="btn btn-action-circle btn-edit" data-bs-toggle="modal" data-bs-target="#chargeModal" (click)="openUpdateModal(charge)">
                <i class="bi bi-pencil-fill"></i>
              </button>
              <button class="btn btn-action-circle btn-delete" (click)="deleteCharge(charge.chargeId)">
                <i class="bi bi-trash3-fill"></i>
              </button>
            </div>
          </td>
        </tr>

        <!-- Empty state -->
        <tr *ngIf="charges.length === 0">
          <td colspan="5" class="text-center text-muted">No Charges Found</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add / Update Charge Modal -->
  <div class="modal fade" id="chargeModal" tabindex="-1" aria-labelledby="chargeModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content border-blood-orange bg-soft-peach shadow-lg rounded-4">

        <!-- Header -->
        <div class="modal-header bg-blood-orange text-white">
          <h5 class="modal-title fw-bold px-3 py-2 rounded text-white" id="chargeModalLabel">
            {{ selectedCharge?.chargeId ? 'Update Charge' : 'Add Charge' }}
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>

        <!-- Body -->
        <div class="modal-body">
          <form *ngIf="selectedCharge" #chargeForm="ngForm" (ngSubmit)="chargeForm.valid && saveCharge()" novalidate>
            <div class="p-4 border rounded shadow-sm bg-light">

              <!-- Charge Type -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Charge Type</label>
                <input type="text" class="form-control"
                       [(ngModel)]="selectedCharge.chargeType"
                       name="chargeType"
                       required minlength="3">
              </div>

              <!-- Value -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Value</label>
                <input type="number" class="form-control"
                       [(ngModel)]="selectedCharge.value"
                       name="value"
                       min="0" required>
              </div>

              <!-- Active Toggle -->
              <div class="mb-3 form-check form-switch">
                <input type="checkbox" class="form-check-input"
                       [(ngModel)]="selectedCharge.isActive"
                       name="isActive"
                       id="isActiveSwitch">
                <label class="form-check-label fw-semibold" for="isActiveSwitch">Active</label>
              </div>
            </div>

            <!-- Footer -->
            <div class="modal-footer border-top pt-3 d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-secondary px-4" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-blood-orange px-4" data-bs-dismiss="modal">
                {{ selectedCharge.chargeId ? 'Update Charge' : 'Save Charge' }}
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Banner -->
  <div *ngIf="notification"
       class="alert global-notification position-fixed top-0 end-0 m-3 shadow-lg"
       [ngClass]="{
         'alert-success': (notification | lowercase).includes('success'),
         'alert-danger': (notification | lowercase).includes('error'),
         'alert-info': !(notification | lowercase).includes('success') && !(notification | lowercase).includes('error')
       }"
       role="alert">
    {{ notification }}
  </div>
</div>
